spring.application.name=travel-planner-api
# Hosting platforms (e.g. Render) tell the app which port to use via $PORT; 8080 locally.
server.port=${PORT:8080}
# Secrets (DB password, ...) live in the gitignored local.properties
spring.config.import=optional:classpath:local.properties

spring.jpa.database=postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/travel_planner
spring.datasource.username=sreelekha

spring.jpa.show-sql=true
# Liquibase owns the schema (src/main/resources/db/changelog). Hibernate only checks that
# the entities match the tables and refuses to start if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT signing key (256-bit, base64). No default on purpose: the app refuses to start
# without one. Production sets APP_JWT_SECRET; local dev sets app.jwt.secret in
# local.properties. Generate one with: openssl rand -base64 32
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=30m
# Session length when "Keep me signed in" is ticked.
app.jwt.remember-me-expiration=7d
# Secure flag on the auth cookie. false only because local dev is plain http;
# production must set APP_AUTH_COOKIE_SECURE=true (HTTPS).
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}
