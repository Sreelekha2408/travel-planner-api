spring.application.name=travel-planner-api
# Secrets (DB password, ...) live in the gitignored local.properties
spring.config.import=optional:classpath:local.properties

spring.jpa.database=postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/travel_planner
spring.datasource.username=sreelekha

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT signing key (256-bit, base64). The default is for local dev only;
